name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - windows
          - all

jobs:
  # ── Windows desktop ────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'all' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.1'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip artifact
        run: |
          Compress-Archive `
            -Path "build\windows\runner\Release\*" `
            -DestinationPath "tradezen-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tradezen-windows
          path: tradezen-windows.zip

  # ── Android APK ────────────────────────────────────────────
  build-android:
    name: Android
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.1'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          dart run flutter_launcher_icons

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: tradezen-android
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: owners
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: "Build ${{ github.run_number }} — ${{ github.sha }}"

  # ── GitHub Release (tag pushes only) ───────────────────────
  publish:
    name: Publish Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tradezen-windows
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: tradezen-android
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "TradeZen ${{ github.ref_name }}"
          body: |
            ## TradeZen ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows 10/11 | `tradezen-windows.zip` — extract and run `tradezen_flutter.exe` |
            | Android | `app-arm64-v8a-release.apk` (most phones) |

            > Windows requires [WebView2 Runtime](https://go.microsoft.com/fwlink/p/?LinkId=2124703) for chart pages (already installed on most machines with Edge).
          files: artifacts/**
          draft: false
          prerelease: false
